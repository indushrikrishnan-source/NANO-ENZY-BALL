<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nano Enzy Capsule - 3D Digital Twin</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; font-family: sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* UI Overlay */
    .ui-overlay {
      position: absolute; top: 20px; left: 20px;
      background: rgba(13, 25, 30, 0.85); padding: 20px;
      border-radius: 10px; border: 1px solid #1a4a4a;
      backdrop-filter: blur(8px); width: 280px;
    }
    h2 { margin: 0 0 10px 0; font-size: 1.1rem; color: #40e0d0; }
    p { font-size: 0.85rem; color: #b0c4de; line-height: 1.4; }
    .control-btn {
      width: 100%; padding: 10px; margin-top: 10px;
      background: #008b8b; border: none; color: white;
      font-weight: bold; border-radius: 5px; cursor: pointer;
      transition: 0.3s;
    }
    .control-btn:hover { background: #20b2aa; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h2>Nano Enzy Digital Twin</h2>
    <p><b>Size:</b> ~3.5 cm Sphere</p>
    <p><b>Layer 1:</b> Matte Green PHA Perforated Shell</p>
    <p><b>Layer 2:</b> Honeycomb Trap Matrix</p>
    <p><b>Core:</b> Rigid PHA Balance Core with FAST-PETase Beads</p>
    <button class="control-btn" onclick="toggleExplodedView()">Toggle Cutaway View</button>
  </div>

  <script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 3, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const coreLight = new THREE.PointLight(0x00f0ff, 2, 5);
    scene.add(coreLight);

    // Group for capsule parts
    const capsuleGroup = new THREE.Group();
    scene.add(capsuleGroup);

    // 1. Layer 1: Outer Shell (Matte Green)
    const shellGeo = new THREE.SphereGeometry(2.5, 32, 16, 0, Math.PI * 1.5); // Cutaway sphere
    const shellMat = new THREE.MeshStandardMaterial({ 
      color: 0x2e5a44, 
      roughness: 0.8, 
      side: THREE.DoubleSide 
    });
    const outerShell = new THREE.Mesh(shellGeo, shellMat);
    capsuleGroup.add(outerShell);

    // 2. Layer 2: Honeycomb / Inner Matrix
    const matrixGeo = new THREE.SphereGeometry(2.2, 16, 16, 0, Math.PI * 1.5);
    const matrixMat = new THREE.MeshStandardMaterial({ 
      color: 0x3b7a57, 
      wireframe: true 
    });
    const matrix = new THREE.Mesh(matrixGeo, matrixMat);
    capsuleGroup.add(matrix);

    // 3. Rigid Core with Glowing Enzyme Beads
    const coreGeo = new THREE.SphereGeometry(1.0, 32, 32);
    const coreMat = new THREE.MeshStandardMaterial({ 
      color: 0x00d2ff, 
      emissive: 0x0088cc, 
      roughness: 0.2 
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    capsuleGroup.add(core);

    // Injectable Enzyme Beads inside Matrix
    for (let i = 0; i < 30; i++) {
      const beadGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const beadMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const bead = new THREE.Mesh(beadGeo, beadMat);
      
      const phi = Math.acos(-1 + (2 * i) / 30);
      const theta = Math.sqrt(30 * Math.PI) * phi;
      bead.position.setFromSphericalCoords(1.6, phi, theta);
      capsuleGroup.add(bead);
    }

    // Interactive Exploded State Toggle
    let exploded = false;
    function toggleExplodedView() {
      exploded = !exploded;
      outerShell.position.x = exploded ? -1.5 : 0;
      matrix.position.x = exploded ? -0.5 : 0;
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      capsuleGroup.rotation.y += 0.005; // Auto rotation
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Window resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

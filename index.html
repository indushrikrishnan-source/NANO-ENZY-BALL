<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAST-PETase 3D Filtration Capsule UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1320; 
      color: #e2e8f0; 
      overflow: hidden; 
      height: 100vh;
    }
    
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* UI Overlay Panels */
    .ui-panel {
      position: absolute;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .ui-header {
      top: 20px; left: 20px; width: 320px;
    }
    .ui-controls {
      bottom: 20px; left: 20px; width: 320px;
    }
    .ui-stats {
      top: 20px; right: 20px; width: 280px;
    }

    h1 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    p { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
    
    .btn {
      width: 100%;
      padding: 10px 14px;
      margin-top: 10px;
      background: #0284c7;
      border: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #0369a1; }
    
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    /* Switch styling */
    .switch {
      position: relative; display: inline-block; width: 44px; height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155; transition: .4s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(22px); }

    .spec-item {
      display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.8rem;
    }
    .spec-label { color: #64748b; }
    .spec-val { color: #f1f5f9; font-weight: 500; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-panel ui-header">
    <h1>FAST-PETase Capsule</h1>
    <p>3D-Printed Microplastic Degradation Sphere</p>
    
    <div class="toggle-group">
      <span>Cutaway View</span>
      <label class="switch">
        <input type="checkbox" id="cutawayToggle" onchange="toggleCutaway(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="ui-panel ui-controls">
    <button class="btn" onclick="resetCamera()">Reset View</button>
    
    <div class="toggle-group">
      <span>Auto-Rotation</span>
      <label class="switch">
        <input type="checkbox" id="rotateToggle" checked onchange="toggleRotation(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="ui-panel ui-stats">
    <h1>Specifications</h1>
    <div class="spec-item"><span class="spec-label">Diameter:</span><span class="spec-val">3.5 cm</span></div>
    <div class="spec-item"><span class="spec-label">Layer 1:</span><span class="spec-val">PHA Porous Shell</span></div>
    <div class="spec-item"><span class="spec-label">Layer 2:</span><span class="spec-val">Honeycomb Matrix</span></div>
    <div class="spec-item"><span class="spec-label">Active Core:</span><span class="spec-val">FAST-PETase Beads</span></div>
    <div class="spec-item"><span class="spec-label">Flow Direction:</span><span class="spec-val">Unidirectional</span></div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let mainGroup, shellMesh, cutawayShellMesh, matrixGroup, beadsGroup;
    let autoRotate = true;

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1320);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(6, 4, 8);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 15, 10);
      scene.add(dirLight);

      const bluePointLight = new THREE.PointLight(0x38bdf8, 1.5, 10);
      bluePointLight.position.set(0, 0, 0);
      scene.add(bluePointLight);

      // Main Capsule Group
      mainGroup = new THREE.Group();
      scene.add(mainGroup);

      buildCapsule();

      // Window Resize Event
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function buildCapsule() {
      // 1. Layer 1: Outer PHA Perforated Shell (Beige/Tan)
      const shellGeo = new THREE.SphereGeometry(2.5, 64, 64);
      const shellMat = new THREE.MeshStandardMaterial({
        color: 0xe3d5ca,
        roughness: 0.6,
        metalness: 0.1
      });

      shellMesh = new THREE.Mesh(shellGeo, shellMat);
      mainGroup.add(shellMesh);

      // Cutaway version of outer shell
      const cutawayGeo = new THREE.SphereGeometry(2.5, 64, 64, 0, Math.PI * 1.5);
      cutawayShellMesh = new THREE.Mesh(cutawayGeo, shellMat);
      cutawayShellMesh.visible = false;
      mainGroup.add(cutawayShellMesh);

      // 2. Layer 2: Honeycomb Lattice (Beige/Gold)
      matrixGroup = new THREE.Group();
      const matrixGeo = new THREE.IcosahedronGeometry(2.1, 2);
      const matrixMat = new THREE.MeshStandardMaterial({
        color: 0xd4a373,
        wireframe: true,
        wireframeLinewidth: 3
      });
      const matrixMesh = new THREE.Mesh(matrixGeo, matrixMat);
      matrixGroup.add(matrixMesh);
      mainGroup.add(matrixGroup);

      // 3. Green FAST-PETase Enzyme Beads (Matching uploaded image)
      beadsGroup = new THREE.Group();
      const beadGeo = new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.25, 0.35, 8, 16) : new THREE.SphereGeometry(0.3, 16, 16);
      const beadMat = new THREE.MeshStandardMaterial({
        color: 0x10b981,
        roughness: 0.2,
        metalness: 0.1,
        emissive: 0x047857,
        emissiveIntensity: 0.3
      });

      // Place several enzyme beads inside the matrix lattice
      const beadPositions = [
        [0, 0, 0], [0.8, 0.5, 0.4], [-0.7, -0.4, 0.6], 
        [0.5, -0.8, -0.3], [-0.6, 0.7, -0.5], [0.2, 0.9, -0.2]
      ];

      beadPositions.forEach(pos => {
        const bead = new THREE.Mesh(beadGeo, beadMat);
        bead.position.set(...pos);
        bead.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        beadsGroup.add(bead);
      });

      mainGroup.add(beadsGroup);
    }

    function toggleCutaway(isCutaway) {
      shellMesh.visible = !isCutaway;
      cutawayShellMesh.visible = isCutaway;
    }

    function toggleRotation(shouldRotate) {
      autoRotate = shouldRotate;
    }

    function resetCamera() {
      camera.position.set(6, 4, 8);
      controls.reset();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate && mainGroup) {
        mainGroup.rotation.y += 0.005;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
